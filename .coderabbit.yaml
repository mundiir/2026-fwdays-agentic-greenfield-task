# Тимчасова гілка для ПОВТОРНОГО рев'ю критичного коду (< 150 файлів, щоб
# CodeRabbit не пропускав через ліміт). Мета — підтвердити, що попередні
# зауваження закриті. tone_instructions тримаємо в межах 250 БАЙТІВ.
language: "uk-UA"
tone_instructions: >-
  Пиши українською, стисло. Фокус — реальні баги, коректність, безпека,
  крайові випадки, гонки. Не чіпляйся до стилю, який ловить лінтер.
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
