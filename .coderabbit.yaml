# Тимчасова гілка для рев'ю НАЙКРИТИЧНІШОГО коду проєкту (< 150 файлів, щоб
# CodeRabbit не пропускав через ліміт). Тут — лише продуктовий код; фокус на
# реальних дефектах, а не на процесі/доказах ДЗ (це в основному PR).
language: "uk-UA"
tone_instructions: >-
  Пиши українською, стисло і по суті. Фокус — реальні баги, помилки коректності,
  безпека (секрети, валідація вводу, ін'єкції), крайові випадки, гонки й ясність
  коду. Не чіпляйся до стилю, який ловить лінтер. Познач найкритичніше першим.
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
